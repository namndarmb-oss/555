name: Build APK and Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project
        run: |
          set -eux

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: |
          set -eux

          gradle clean assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Find APK
        id: apk
        run: |
          set -eux

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "NotificationToTelegram v1.0.${{ github.run_number }}"
          body: |
            ## NotificationToTelegram

            Release APK automatically built from commit:

            `${{ github.sha }}`

            Android Release APK is attached below.
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
