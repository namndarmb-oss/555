name: Build APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project
        run: |
          set -eux

          echo "Checking project files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project files OK."

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Build Release APK
        run: |
          set -eux

          gradle clean assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        run: |
          set -eux

          echo "===== APK FILES ====="

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"

          echo "APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotificationToTelegram-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
