name: Build APK and Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # Java 17
      # ==============================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # Show project structure
      # ==============================
      - name: Inspect project
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "PROJECT STRUCTURE"
          echo "=============================="

          find . -maxdepth 4 -type f | sort | head -500

          echo ""
          echo "=============================="
          echo "GRADLE FILES"
          echo "=============================="

          find . -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      # ==============================
      # Install Gradle
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==============================
      # Check Gradle
      # ==============================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          echo "Gradle version:"
          gradle --version

      # ==============================
      # Find Android project
      # ==============================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "The repository does not currently contain a recognizable Gradle Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Settings file:"
          echo "$SETTINGS"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==============================
      # Build Release APK
      # ==============================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================="
          echo "BUILDING RELEASE APK"
          echo "=============================="

          gradle clean assembleRelease \
            --stacktrace \
            --no-daemon

      # ==============================
      # Find APK
      # ==============================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "SEARCHING FOR APK"
          echo "=============================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            ! -name "*unsigned*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/MQ-Live.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh "$GITHUB_WORKSPACE/release/MQ-Live.apk"

      # ==============================
      # GitHub Release
      # ==============================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: M.Q APK ${{ github.run_number }}
          body: |
            # M.Q Android APK

            Automatically built from commit:

            ${{ github.sha }}

            Build number:
            ${{ github.run_number }}
          files: |
            release/MQ-Live.apk
          generate_release_notes: true
          make_latest: true
