name: Build Debug APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Termux Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0
          TERMUX_APK_VERSION_TAG: debug
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "1"
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show generated APKs
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
