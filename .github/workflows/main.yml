name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== ZIP CONTENTS ====="
          find extracted -type f | sort

      - name: Detect project root
        shell: bash
        run: |
          set -e

          echo "===== Searching for Android project ====="

          find extracted \
            -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Copy project into repository
        shell: bash
        run: |
          set -e

          # Copy everything extracted into repository root.
          cp -R extracted/. .

          rm -rf extracted

          echo "===== Repository after extraction ====="
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Remove ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"
          rm -f "$ZIP_FILE"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract Android project from ZIP"

          git push
