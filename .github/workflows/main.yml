name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -e

          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -type f | sort

      - name: Copy Android project
        run: |
          set -e

          cp -R extracted/. .

          rm -rf extracted

          echo "===== PROJECT FILES ====="
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            ! -name "*.zip" \
            | sort

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"

      - name: Verify project
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project detected successfully."

      - name: Commit project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          git commit -m "Extract Android project"

          git push
