name: Extract ZIP into Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          set -e

          ZIP_FILE="termux-app-luxury-redesigned.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== Extracted files ====="
          find extracted -type f -print

      - name: Move extracted files
        run: |
          set -e

          cp -R extracted/. .

          rm -rf extracted

      - name: Remove ZIP
        run: |
          rm -f "termux-app-luxury-redesigned.zip"

      - name: Remove build workflow from ZIP
        run: |
          rm -f ".github/workflows/build_apk.yml"
          
      - name: Commit extracted project
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project from ZIP"

          git push
